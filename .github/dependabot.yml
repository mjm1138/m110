# Dependabot: automated dependency-update PRs, so a security fix in a dependency
# (e.g. Pillow — which decodes untrusted imported images) is surfaced as a PR that
# CI validates, instead of relying on someone noticing. See SECURITY_ASSESSMENT.md.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # `mcp` 2.x is a breaking rewrite: it removed the low-level `Server` decorator
    # API (`@server.list_tools()`, `@server.call_tool()`, the prompt/resource
    # pairs) that `assistant/mcp_server.py` is built on, so `build_server()` dies
    # on its first line under 2.0.0. Dependabot has proposed the bump twice (#115,
    # closed; #121, the same branch re-raised a week later) and CI passed both
    # times, because nothing in the suite imports `mcp` — the smoke-test step
    # added to ci.yml is what closes that hole.
    #
    # Ignoring only MAJOR versions: 1.x patch/minor updates, and any security
    # advisory against them, still come through — which is the point of having
    # Dependabot here at all. This is a deliberate, temporary hold, not a
    # decision to stay on 1.x: v1 is maintenance-only (security fixes), so the
    # port is scheduled work — ROADMAP item 4. **Remove this block as part of
    # that port**, in the same PR that lifts the bound in pyproject.toml.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch routine version bumps into one PR to cut noise; security updates
      # still come through even when they land outside the group window.
      python-deps:
        patterns: ["*"]

  # The GitHub Actions used by the CI + release workflows (checkout, setup-python,
  # upload/download-artifact). Pinned to major tags today; Dependabot keeps them
  # current and flags any advisory against them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # upload-artifact and download-artifact must INTEROPERATE (an upload@vN
      # artifact isn't always readable by a download@vM — the v3→v4 break is the
      # classic case). Dependabot would otherwise open them as separate PRs and
      # merging one alone would leave the release pipeline mismatched. Group them
      # so the pair always lands together and can be validated in one dispatch run.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      # Everything else (checkout, setup-python) is independent — one PR each is
      # fine, and CI genuinely exercises those two.
