# Dependabot: automated dependency-update PRs, so a security fix in a dependency
# (e.g. Pillow — which decodes untrusted imported images) is surfaced as a PR that
# CI validates, instead of relying on someone noticing. See SECURITY_ASSESSMENT.md.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # (The temporary `mcp` major-ignore that lived here is gone: the v2 port
    # landed, so there is nothing left to hold back. It was only ever a stopgap
    # while a known-breaking major sat unported — the durable guard is the
    # smoke-test step in ci.yml, which starts the server and speaks JSON-RPC to
    # it, so the next breaking major fails CI loudly instead of passing green
    # the way #115 and #121 did.)
    groups:
      # Batch routine version bumps into one PR to cut noise; security updates
      # still come through even when they land outside the group window.
      python-deps:
        patterns: ["*"]

  # The GitHub Actions used by the CI + release workflows (checkout, setup-python,
  # upload/download-artifact). Pinned to major tags today; Dependabot keeps them
  # current and flags any advisory against them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # upload-artifact and download-artifact must INTEROPERATE (an upload@vN
      # artifact isn't always readable by a download@vM — the v3→v4 break is the
      # classic case). Dependabot would otherwise open them as separate PRs and
      # merging one alone would leave the release pipeline mismatched. Group them
      # so the pair always lands together and can be validated in one dispatch run.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      # Everything else (checkout, setup-python) is independent — one PR each is
      # fine, and CI genuinely exercises those two.
