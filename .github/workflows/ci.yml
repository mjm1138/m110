# Continuous Integration: run the test suite on a fresh machine for every push
# to main and every pull request. Green = a clean checkout installs and tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test workflow only needs to read the checked-out code. An
# explicit block overrides any repo/org default that would grant the job's
# GITHUB_TOKEN write scopes (a fork-PR could otherwise run with more than it needs).
permissions:
  contents: read

# If you push twice quickly, cancel the older in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # let all matrix legs finish even if one fails
      matrix:
        python-version: ["3.11", "3.14"]   # floor (requires-python) + dev target

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip           # cache the pip download dir keyed on the lock/pyproject

      # PySide6's offscreen platform plugin still links against these system
      # libraries. They are not preinstalled on the bare runner; without them
      # importing PySide6 fails with a "could not load the Qt platform plugin"
      # error even though QT_QPA_PLATFORM=offscreen.
      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          # `dev` already bundles astroquery + jinja2 + markdown (needed by the
          # publish/online tests and tools/), so it is a superset of the `online`
          # and `publish` extras — no need to list them separately.
          pip install -e ".[dev]"

      # The sky map (ROADMAP item 12) draws its charts with uranometria, which
      # is not on PyPI yet — so it cannot be declared in `pyproject.toml` (a
      # direct URL reference there would be rejected on any future PyPI upload,
      # extras included) and is installed here instead. Without it the render
      # tests in tests/test_skymap.py skip, which would quietly leave the chart
      # path uncovered on CI; the engine itself degrades via SkymapDepsMissing.
      - name: Install the optional sky-map dependency
        run: pip install "uranometria @ git+https://github.com/devonjones/uranometria"

      - name: Run the test suite
        run: pytest -q

      # The suite does NOT import `mcp`. The assistant tests are deliberately AST
      # and text checks (that is what makes the "nothing the server can reach can
      # write" proof airtight), so nothing in pytest touches the MCP library — and
      # a dependency bump that breaks the server sails through green. That is not
      # hypothetical: Dependabot PR #115 resolved `mcp` to 2.0.0, CI installed it,
      # both matrix legs passed, and every decorator `build_server()` is built on
      # (`@server.list_tools()`, `@server.call_tool()`, the prompt/resource pairs)
      # had been removed in that release — `build_server()` dies on its first line
      # with `AttributeError: 'Server' object has no attribute 'list_prompts'`.
      #
      # That bound is load-bearing for a RELEASE, not just for local dev: the
      # `build` extra self-references `m110[assistant]` and release.yml installs
      # `.[build]`, so a bad bump ships a frozen `m110-mcp` that dies at startup.
      #
      # So: actually start the server and speak JSON-RPC to it. `smoke_mcp.py`
      # spawns it exactly as a client would and checks the handshake, the tool
      # list and the skills — the surface an API break destroys. It needs a store
      # to exist (it reads one), hence the bootstrap; an empty one is enough, and
      # the "no derived data yet" notes it prints are warnings, not failures.
      #
      # `!cancelled()` rather than `success()` so a failing suite doesn't mask this
      # signal — both results land in the same run.
      - name: Smoke-test the assistant MCP server (guards the `mcp` bound)
        if: ${{ !cancelled() }}
        run: |
          python -c "from m110 import config; config.ensure_data_root('${{ runner.temp }}/m110-smoke')"
          python tools/smoke_mcp.py --root "${{ runner.temp }}/m110-smoke"
