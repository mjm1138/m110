[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m110"
version = "0.3.0b3"
description = "Library / tracker / processing-prep desktop app for smart-telescope deep-sky workflows (PySide6 GUI over a headless Python engine)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael Merideth", email = "mjm1138@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "PySide6>=6.6",
    "astropy>=6.0",     # build_derived reads FITS stack-metadata headers
    "numpy>=1.26",      # image stretching
    "pillow>=12.3",     # thumbnails + heroes — decodes UNTRUSTED imported images, so
                        # the floor is held at the PYSEC-2026-2253..2257 fix (12.3.0).
                        # SECURITY_ASSESSMENT.md F2
    "tifffile>=2024.1", # Siril 32-bit float TIF thumbnails
    "packaging>=23",    # updates.py: PEP 440 release-tag comparison (previously an
                        # undeclared transitive — a clean venv would silently
                        # disable the update check)
    "tzdata",           # IANA time-zone database for `zoneinfo` (planning uses site
                        # timezones + a UTC anchor at import). Windows has NO system tz
                        # db, so the frozen build crashed on launch without this bundled
                        # (issue #56). Harmless everywhere else — zoneinfo searches the
                        # OS db first and only falls back to this package.
    # macOS-only: lets the app-menu / dock show "M110" instead of "Python" when run
    # unbundled from source (patches NSBundle's CFBundleName). Optional at runtime.
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Optional online enrichment (Add object / Enrich online — Simbad lookups). Runtime
# stays offline unless installed; the online actions degrade gracefully without it.
online = ["astroquery>=0.4"]
# Optional static-site publishing (Library → Publish / share). Runtime degrades
# gracefully (PublishDepsMissing) when absent.
publish = ["jinja2>=3", "markdown>=3"]
# Optional in-app assistant: the stdio MCP server exposing the engine's tool
# registry to an external client (Claude Desktop / Claude Code). The registry
# itself has no MCP dependency — only `assistant.mcp_server` imports it, and it
# degrades with a friendly message when absent.
# The `<2` bound is deliberate, NOT staleness: mcp 2.0 removed the low-level
# `Server` decorator API (`@server.list_tools()` / `@server.call_tool()` / the
# prompt + resource pairs) that `assistant/mcp_server.py` is built on, so a bare
# bump makes `build_server()` raise AttributeError. Lift it only with the port —
# ROADMAP item 4 → Open. Note the suite won't catch a bad bump (the assistant
# tests never import `mcp`); run `tools/smoke_mcp.py`. Keep this bound in sync
# with `dev`, below.
assistant = ["mcp>=1.9,<2"]
# NOTE — the sky map (ROADMAP item 12) needs `uranometria`, which is deliberately
# NOT declared here. It isn't on PyPI yet, and a direct URL requirement is
# rejected on upload *anywhere* in the metadata, extras included — so declaring
# it now would be a landmine on the first `pip install m110`. Install it
# explicitly instead (CI does; packaged builds will):
#     pip install "uranometria @ git+https://github.com/devonjones/uranometria"
# `m110.skymap` degrades via SkymapDepsMissing when it's absent. Swap this for a
# real `skymap = ["uranometria>=0.11"]` extra once it's published.
dev = ["pytest>=8", "pytest-qt>=4.4", "astroquery>=0.4", "jinja2>=3", "markdown>=3",
       "mcp>=1.9,<2", "jsonschema>=4"]  # astroquery also build-time (tools/gen_caldwell.py);
                                        # jsonschema validates the tool schemas in tests;
                                        # `mcp` bound: see the `assistant` extra above
# Packaging the desktop app into native bundles/installers (see packaging/).
# Pulls in `online` (astroquery) so the packaged app bundles Simbad enrichment — a
# frozen build has no pip, so an app user can't add the extra themselves (issue #64).
# Source installs stay lean: `online` remains opt-in for `pip install m110`.
build = ["pyinstaller>=6.6", "m110[online]", "m110[assistant]"]

[project.gui-scripts]
m110 = "m110.ui.main:main"

# NOT a gui-script: on Windows that produces a pythonw launcher with no console
# and no usable stdio, which is fatal for a stdio JSON-RPC server.
[project.scripts]
m110-mcp = "m110.assistant.mcp_server:main"

[tool.setuptools]
packages = ["m110", "m110.ui", "m110.ui.theme", "m110.publish", "m110.backup",
            "m110.backup.backends", "m110.assistant", "m110.assistant.tools"]

[tool.setuptools.package-data]
m110 = ["seed/*.toml", "seed/catalogs/*.toml", "seed/geonames/*.tsv.gz",
        "assistant/skills/*/*.md"]
"m110.publish" = ["templates/*.html", "templates/*.css", "templates/*.js"]
"m110.ui.theme" = ["fonts/*.ttf", "fonts/*.txt", "brand/*.svg", "brand/*.png", "icons/*.svg"]
