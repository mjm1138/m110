[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronamigo"
version = "0.0.1"
description = "Library / tracker / processing-prep desktop app for smart-telescope deep-sky workflows (PySide6 GUI over a headless Python engine)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "astropy>=6.0",   # build_derived reads FITS stack-metadata headers
]

[project.optional-dependencies]
# Extras pulled in as later Phase-0 modules (build_site / rendering) are ported.
render = ["jinja2>=3.1", "markdown>=3.5", "pillow>=10", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.gui-scripts]
astronamigo = "astronamigo.ui.main:main"

[tool.setuptools]
packages = ["astronamigo", "astronamigo.ui"]

[tool.setuptools.package-data]
astronamigo = ["seed/*.toml"]
