[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronamigo"
version = "0.0.1"
description = "Library / tracker / processing-prep desktop app for smart-telescope deep-sky workflows (PySide6 GUI over a headless Python engine)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "astropy>=6.0",     # build_derived reads FITS stack-metadata headers
    "numpy>=1.26",      # image stretching
    "pillow>=10",       # thumbnails + heroes
    "tifffile>=2024.1", # Siril 32-bit float TIF thumbnails
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
astronamigo = "astronamigo.ui.main:main"

[tool.setuptools]
packages = ["astronamigo", "astronamigo.ui"]

[tool.setuptools.package-data]
astronamigo = ["seed/*.toml"]
