[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronamigo"
version = "0.0.1"
description = "Library / tracker / processing-prep desktop app for smart-telescope deep-sky workflows (PySide6 GUI over a headless Python engine)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
# Engine extras, pulled in as Phase-0 modules are ported from Astronomy/scripts.
engine = ["astropy>=6.0", "numpy>=1.26", "jinja2>=3.1", "markdown>=3.5", "pillow>=10"]
dev = ["pytest>=8"]

[project.gui-scripts]
astronamigo = "astronamigo.ui.main:main"

[tool.setuptools]
packages = ["astronamigo", "astronamigo.ui"]
