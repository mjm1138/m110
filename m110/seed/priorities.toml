# Priority targets — starts empty for a fresh library.
#
# This file is user-owned: hand-edit it (or an LLM can) to call out targets you
# want to prioritize, and M110 joins each entry with your capture totals in
# build_derived.py to show progress on the Summary "Priority targets" view. You
# can also Pin/Mute objects from the Library or Goals pages (that lives in
# pins.toml) without touching this file.
#
# Fields for a [[priority]] entry:
#   id                       — display name; matches a capture folder or catalog id
#   type_hint                — short type label for the table
#   season                   — calendar window when the target is workable
#   priority                 — high / medium / low
#   filter                   — ON / OFF / IRCUT / LP per your scope's setting
#   strategy                 — per-target intent (one line)
#   target / target_integration_min — the goal; demote when met
#   track                    — optional bool (default true). Set false for a
#                              campaign / reminder entry (multi-object or
#                              multi-filter) whose id doesn't map to one capture
#                              folder; it then renders without a progress bar
#                              instead of a misleading auto-rollup.
#
# Example (uncomment and edit):
#
# [[priority]]
# id = "M51"
# type_hint = "Galaxy"
# season = "Mar–May"
# priority = "high"
# filter = "IRCUT"
# strategy = "Bright spring galaxy — good first deep target"
# target = "06:00"
# target_integration_min = 360
