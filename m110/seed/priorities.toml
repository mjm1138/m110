# Priority targets for the Seestar S50 collection.
# Edited by hand. Joined with totals in build_derived.py to compute progress.
#
# Fields:
#   id                       — display name; matches FITS folder or catalog id
#   type_hint                — short type label for the table
#   season                   — calendar window when the target is workable
#   priority                 — high / medium / low
#   filter                   — ON / OFF / IRCUT / LP per S50 setting
#   strategy                 — per-target intent (one line)
#   target / target_integration_min — the goal; demote when met
#   track                    — optional bool (default true). Set false for a
#                              campaign / reminder entry (multi-object or
#                              multi-filter) whose id doesn't map to one capture
#                              folder; it then renders without a progress bar
#                              instead of a misleading auto-rollup.

